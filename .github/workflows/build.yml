name: build-installers
# Lấy .exe (Windows) và binary (Linux) mà KHÔNG cần máy Windows:
# push code lên GitHub -> tab Actions -> chạy workflow -> tải Artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # setup-python đã kèm tkinter
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name ads_config_generator ads_config_generator.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/ads_config_generator.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # setup-python đã kèm tkinter
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name ads_config_generator ads_config_generator.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/ads_config_generator.app

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name ads_config_generator ads_config_generator.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/ads_config_generator
